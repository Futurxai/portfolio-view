<style>
:root { color-scheme: light; --bg:#f4f3f0; --card:#fcfcfb; --border:#e2e1dc; --text:#0b0b0b; --muted:#52514e; --accent:#2a78d6; --bad:#c42f2f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#111110; --card:#1a1a19; --border:#33332f; --text:#f0efec; --muted:#c3c2b7; --accent:#3987e5; --bad:#ef6b6b; } }
:root[data-theme="dark"] { color-scheme: dark; --bg:#111110; --card:#1a1a19; --border:#33332f; --text:#f0efec; --muted:#c3c2b7; --accent:#3987e5; --bad:#ef6b6b; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
  font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; }
h1 { font-size:18px; margin:0 0 4px; } p { color:var(--muted); font-size:13px; margin:0 0 16px; }
input[type=password] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font:inherit; }
button { width:100%; margin-top:12px; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
button[disabled] { opacity:.6; }
label { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted); margin-top:12px; }
.err { color:var(--bad); font-size:13px; min-height:18px; margin-top:10px; }

<script>
(async function () {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
                  del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  async function unlock(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b(P.salt), iterations: P.iter },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.iv) }, key, b(P.ct));
    return new TextDecoder().decode(pt);
  }
  async function attempt(pw, remember) {
    const go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; go.textContent = "Decrypting…"; err.textContent = "";
    try {
      const html = await unlock(pw);
      if (remember) store.set("pt-pass", pw);
      document.open(); document.write(html); document.close();
    } catch (e) {
      store.del("pt-pass");
      err.textContent = "Wrong passphrase.";
      go.disabled = false; go.textContent = "Unlock";
    }
  }
  if (!window.crypto || !crypto.subtle) {
    document.getElementById("err").textContent = "This browser can't decrypt (needs HTTPS and WebCrypto).";
    return;
  }
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    attempt(document.getElementById("pw").value, document.getElementById("rem").checked);
  });
  const saved = store.get("pt-pass");
  if (saved) attempt(saved, true);
})();
</script></body></html>
